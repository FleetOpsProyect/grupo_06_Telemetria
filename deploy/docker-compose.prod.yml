# Producción (EC2). El CD copia este archivo al servidor en cada despliegue:
#   ~/fleetops-telemetria/docker-compose.prod.yml
# No contiene secretos: los valores ${...} salen del .env que vive SOLO en el servidor
# (POSTGRES_*, DOCKERHUB_USERNAME, IMAGE_TAG, AWS_REGION, SNS_TOPIC_ARN, SQS_QUEUE_URL, ...).
# La mensajería es AWS SNS/SQS; las credenciales llegan por el rol IAM de la instancia.
services:
  postgres:
    image: postgres:16-alpine
    container_name: telemetria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - telemetria_pg_data:/var/lib/postgresql/data
    networks: [fleetops_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  telemetria:
    image: ${DOCKERHUB_USERNAME}/fleetops-telemetria:${IMAGE_TAG}
    container_name: telemetria-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
    networks: [fleetops_net]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  telemetria_pg_data:

networks:
  fleetops_net:
