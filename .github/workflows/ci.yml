name: CI

on:
  push:
    branches: [main, master, develop, jep]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type checking and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff mypy pytest pytest-cov httpx

      - name: Ruff - lint
        run: ruff check .

      - name: Ruff - format
        run: ruff format --check .

      - name: Mypy - type checking
        run: mypy app

      - name: Pytest - unit & integration tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      # Análisis estático: si el Quality Gate falla, el job falla y no se publica ni despliega
      - name: SonarCloud - análisis y Quality Gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
