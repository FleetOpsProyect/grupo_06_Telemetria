name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type checking and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff mypy pytest pytest-cov httpx "moto[sns,sqs]==5.2.6"

      - name: Ruff - lint
        run: ruff check .

      - name: Ruff - format
        run: ruff format --check .

      - name: Mypy - type checking
        run: mypy app

      - name: Pytest - unit & integration tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      # Análisis estático en cada Pull Request (a develop o main): si el Quality Gate
      # falla, el PR queda en rojo y no se debe mergear.
      # No corre en el push a main porque el plan gratuito de SonarCloud solo permite
      # consultar el Quality Gate de su rama principal (develop) y de los PR; ese código
      # ya pasó el Quality Gate en el PR que se mergeó.
      - name: SonarCloud - análisis y Quality Gate
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # Despliegue continuo: llama a cd.yml solo si las pruebas y el Quality Gate pasaron
  # y solo cuando se mergea un Pull Request a main (nunca en develop ni en PRs sin mergear)
  cd:
    name: CD
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
