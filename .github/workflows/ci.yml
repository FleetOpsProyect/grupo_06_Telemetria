name: CI

on:
  push:
    branches: [main, master, develop, jep]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type checking and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff mypy pytest pytest-cov httpx

      - name: Ruff - lint
        run: ruff check .

      - name: Ruff - format
        run: ruff format --check .

      - name: Mypy - type checking
        run: mypy app

      - name: Pytest - unit & integration tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      # Análisis estático: si el Quality Gate falla, el job falla y no se publica ni despliega
      - name: SonarCloud - análisis y Quality Gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true


  
  publish-image:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: juanespereira/fleetops-telemetria
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=jep,enable=${{ github.ref == 'refs/heads/jep' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  # Despliegue continuo en AWS EC2: solo cuando se mergea a develop o main
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: publish-image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    concurrency: production

    steps:
      - name: Pull de la nueva imagen y reinicio en el servidor
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd ~/fleetops-telemetria
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            docker compose -f docker-compose.prod.yml pull telemetria
            docker compose -f docker-compose.prod.yml up -d
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
                echo "Despliegue OK: ${IMAGE_TAG}"
                docker image prune -f
                exit 0
              fi
              sleep 3
            done
            echo "La app no respondió /health a tiempo"
            docker compose -f docker-compose.prod.yml logs --tail 80 telemetria
            exit 1
