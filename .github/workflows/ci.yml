name: CI

on:
  push:
    branches: [main, master, develop, jep]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type checking and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff mypy pytest pytest-cov httpx

      - name: Ruff - lint
        run: ruff check .

      - name: Ruff - format
        run: ruff format --check .

      - name: Mypy - type checking
        run: mypy app

      - name: Pytest - unit & integration tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml


  
  publish-image:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: juanespereira/fleetops-telemetria
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=jep,enable=${{ github.ref == 'refs/heads/jep' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

