name: PR Agent

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@c1451f9ae1a00a2d8539640b1f0aa22659dc05a1 # the-pr-agent/pr-agent@main
        env:
          GROQ.KEY: ${{ secrets.GROQ_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          CONFIG.MODEL: "groq/openai/gpt-oss-120b"
          CONFIG.MODEL_TURBO: "groq/openai/gpt-oss-120b"
          CONFIG.FALLBACK_MODELS: "['groq/openai/gpt-oss-20b']"
