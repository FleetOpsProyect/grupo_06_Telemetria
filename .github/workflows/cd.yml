name: CD

# Despliegue continuo (guía del dojo, sección 8.2).
# Arranca solo cuando el workflow "CI" termina en verde (lint, tipos, pruebas y
# Quality Gate de SonarCloud) después de un merge a develop o main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, main]

permissions:
  contents: read

jobs:
  publish-image:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            juanespereira/fleetops-telemetria:sha-${{ github.event.workflow_run.head_sha }}
            juanespereira/fleetops-telemetria:latest

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: publish-image
    concurrency: production

    steps:
      - name: Pull de la nueva imagen y reinicio en el servidor
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd ~/fleetops-telemetria
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            docker compose -f docker-compose.prod.yml pull telemetria
            docker compose -f docker-compose.prod.yml up -d
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
                echo "Despliegue OK: ${IMAGE_TAG}"
                docker image prune -f
                exit 0
              fi
              sleep 3
            done
            echo "La app no respondió /health a tiempo"
            docker compose -f docker-compose.prod.yml logs --tail 80 telemetria
            exit 1
