name: CD

# Despliegue continuo (guía del dojo, sección 8.2).
# Lo llama ci.yml (job "cd") únicamente después de que pasan las pruebas y el
# Quality Gate de SonarCloud en un merge a develop o main.
on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      EC2_HOST:
        required: true
      EC2_USER:
        required: true
      EC2_SSH_KEY:
        required: true

permissions:
  contents: read

jobs:
  publish-image:
    name: Build and publish Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            juanespereira/fleetops-telemetria:sha-${{ github.sha }}
            juanespereira/fleetops-telemetria:latest

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: publish-image
    concurrency: production
    env:
      PUBLIC_URL: https://fleetops-telemetria.duckdns.org

    steps:
      - name: Pull de la nueva imagen y reinicio en el servidor
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd ~/fleetops-telemetria
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            docker compose -f docker-compose.prod.yml pull telemetria
            docker compose -f docker-compose.prod.yml up -d
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
                echo "Despliegue OK: ${IMAGE_TAG}"
                docker image prune -f
                exit 0
              fi
              sleep 3
            done
            echo "La app no respondió /health a tiempo"
            docker compose -f docker-compose.prod.yml logs --tail 80 telemetria
            exit 1

      # Verificación final desde internet: dominio público + Nginx + HTTPS + app + BD + broker
      - name: Health check público del backend
        run: |
          for i in $(seq 1 10); do
            if RESPONSE=$(curl -fsS --max-time 10 "${PUBLIC_URL}/health"); then
              echo "$RESPONSE"
              if echo "$RESPONSE" | grep -q '"status":"UP"'; then
                echo "Backend disponible en ${PUBLIC_URL}"
                exit 0
              fi
            fi
            echo "Intento $i: el backend aún no responde UP, reintentando..."
            sleep 6
          done
          echo "El backend no respondió UP en ${PUBLIC_URL}/health"
          exit 1
