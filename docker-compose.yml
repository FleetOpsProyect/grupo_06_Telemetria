services:
  postgres:
    image: postgres:16-alpine
    container_name: fleetops_telemetria_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemetria_db}
      POSTGRES_USER: ${POSTGRES_USER:-telemetria_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetria_password}
    ports:
      - "5432:5432"
    volumes:
      - telemetria_postgres_data:/var/lib/postgresql/data
    networks:
      - fleetops_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telemetria_user} -d ${POSTGRES_DB:-telemetria_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fleetops_telemetria_broker
    restart: unless-stopped
    ports:
      - "5672:5672"   # Puerto AMQP
      - "15672:15672" # Interfaz web de administración
    volumes:
      - telemetria_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - fleetops_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 5s
      retries: 5

  telemetria-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetops_telemetria_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-telemetria_user}:${POSTGRES_PASSWORD:-telemetria_password}@postgres:5432/${POSTGRES_DB:-telemetria_db}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - RABBITMQ_EXCHANGE=fleetops.events
      - RABBITMQ_QUEUE=q.telemetria
      - RABBITMQ_DLQ=q.telemetria.dlq
      - ASSIGNMENTS_SERVICE_URL=${ASSIGNMENTS_SERVICE_URL:-http://assignments:8001}
      - ASSIGNMENTS_TIMEOUT_SECONDS=2.0
      - CIRCUIT_BREAKER_FAILURE_THRESHOLD=5
      - CIRCUIT_BREAKER_RECOVERY_TIMEOUT_SECONDS=30.0
      - PORT=8000
      - DEBUG=True
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fleetops_net

networks:
  fleetops_net:
    driver: bridge

volumes:
  telemetria_postgres_data:
  telemetria_rabbitmq_data:
